# Salvar em: .github/workflows/snake.yml (só quando for aprovar o README novo)
# Gera a animação da cobrinha a partir do gráfico de contribuições
# e publica os SVGs na branch "output", que o README usa.

name: Generate contribution snake

on:
  schedule:
    - cron: "0 3 * * *"   # todo dia às 00:00 de Brasília
  workflow_dispatch:       # permite rodar na mão pela aba Actions
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00ADB5

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
